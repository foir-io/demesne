[package]
name = "demesne-cli"
description = "The demesne command line: validate, emit, introspect, scaffold, check, diff and coverage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories = ["command-line-utilities", "authentication", "database"]
keywords.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true

[features]
default = ["db"]
db = ["dep:demesne-postgres", "dep:postgres"]

[lib]
name = "demesne_cli"
path = "src/lib.rs"

[[bin]]
name = "demesne"
path = "src/main.rs"
required-features = ["db"]

[dependencies]
demesne-gocompat.workspace = true
demesne-syntax.workspace = true
demesne-runtime.workspace = true
demesne-model.workspace = true
demesne-emit-sql.workspace = true
demesne-emit-ts.workspace = true
demesne-emit-go.workspace = true
demesne-postgres = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }

[lints]
workspace = true
