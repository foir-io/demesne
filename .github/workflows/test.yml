name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DEMESNE_PG_URL: postgres://postgres@localhost:5432/demesne_test?sslmode=disable
      SUPABASE_DB_URL: postgres://postgres@localhost:5432/demesne_supabase?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2,cargo-hack@0.6.45,cargo-semver-checks@0.51.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy -p demesne-wasm -p demesne-runtime-wasm -p demesne-runtime-abi --target wasm32-unknown-unknown -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: deny
        run: cargo deny check
      - name: test
        run: cargo nextest run --workspace --no-tests=fail
      - name: doctests
        run: cargo test --doc --workspace
      - name: live Postgres databases
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -c 'CREATE DATABASE demesne_test'
          -c 'CREATE DATABASE demesne_supabase'
          -c 'CREATE ROLE anon NOLOGIN'
          -c 'CREATE ROLE authenticated NOLOGIN'
          -c 'CREATE ROLE service_role NOLOGIN'
      - name: live Postgres suites
        run: cargo nextest run -p demesne-postgres -p demesne-cli --run-ignored only --no-tests=fail
      - name: wasm32 build
        run: cargo build -p demesne-wasm --target wasm32-unknown-unknown --release
      - name: features
        run: cargo hack check --workspace --ignore-private --each-feature --no-dev-deps
      - name: semver
        run: cargo semver-checks --workspace --baseline-rev "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)"

  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: toolchain
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen@0.2.129
      - name: runtime wasm
        run: scripts/build-runtime-wasm.sh
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm -r build
      - name: typecheck
        run: pnpm -r typecheck
      - name: Postgres binaries
        run: ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - name: test (Node)
        run: pnpm -r test
        env:
          DEMESNE_REQUIRE_PG: "1"
      - name: test in Deno
        run: pnpm --filter @foir/demesne test:deno
      - name: test in workerd
        run: pnpm --filter @foir/demesne test:workerd
      - name: test in Chrome
        run: pnpm --filter @foir/demesne test:browser
      - name: test the packed package (Node, workerd, Chrome)
        run: pnpm --filter @foir/demesne test:packed

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/example/go.sum
      - name: toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: runtime wasm
        run: scripts/build-go-wasm.sh
      - name: the committed runtime wasm is this build
        run: git diff --exit-code -- go/runtime.wasm
      - name: gofmt
        run: test -z "$(gofmt -l go)"
      - name: vet
        run: go vet ./...
        working-directory: go
      - name: test
        run: go test -race ./...
        working-directory: go
      - name: Postgres binaries
        run: ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - name: example under live Postgres
        run: go vet ./... && go test ./...
        working-directory: go/example
        env:
          DEMESNE_REQUIRE_PG: "1"
      - name: emitted Go is gofmt-clean and compiles
        run: cargo build -p demesne-cli && scripts/check-go-emit.sh

  vscode:
    name: VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: toolchain
        run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen@0.2.129
      - name: compiler wasm
        run: npm run build:wasm
      - run: npm ci
      - name: test
        run: npm test
      - name: live validation in VS Code
        run: xvfb-run -a npm run test:vscode
