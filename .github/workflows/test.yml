name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  lint:
    name: Go Lint
    # Hard cognitive-complexity gate (gocognit min-complexity 30), matching
    # the consumer repo. Covers both the root engine module and the nested
    # cmd/demesne module (separate go.mod, so it needs its own invocation).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: lint engine
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.4
      - name: lint cmd/demesne
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.4
          working-directory: cmd/demesne

  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DEMESNE_PG_URL: postgres://postgres@localhost:5432/demesne_test?sslmode=disable
      SUPABASE_DB_URL: postgres://postgres@localhost:5432/demesne_supabase?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2,cargo-hack@0.6.45,cargo-semver-checks@0.51.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy -p demesne-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: deny
        run: cargo deny check
      - name: test
        run: cargo nextest run --workspace --no-tests=fail
      - name: live Postgres databases
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -c 'CREATE DATABASE demesne_test'
          -c 'CREATE DATABASE demesne_supabase'
          -c 'CREATE ROLE anon NOLOGIN'
          -c 'CREATE ROLE authenticated NOLOGIN'
          -c 'CREATE ROLE service_role NOLOGIN'
      - name: live Postgres suites
        run: cargo nextest run -p demesne-postgres --run-ignored only --no-tests=fail
      - name: wasm32 build
        run: cargo build -p demesne-wasm --target wasm32-unknown-unknown --release
      - name: features
        run: cargo hack check --workspace --ignore-private --each-feature --no-dev-deps
      - name: semver
        run: cargo semver-checks --workspace --baseline-rev "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)"

  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm -r build
      - name: typecheck
        run: pnpm -r typecheck
      - name: test
        run: pnpm -r test
