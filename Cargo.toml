[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.94.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/foir-io/demesne"
homepage = "https://github.com/foir-io/demesne"

[workspace.dependencies]
demesne-gocompat = { path = "crates/gocompat", version = "0.94.0-dev" }
demesne-syntax = { path = "crates/syntax", version = "0.94.0-dev" }
demesne-runtime = { path = "crates/runtime", version = "0.94.0-dev" }
demesne-model = { path = "crates/model", version = "0.94.0-dev" }
demesne-emit-sql = { path = "crates/emit-sql", version = "0.94.0-dev" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
